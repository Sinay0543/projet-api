# configure your datasource
quarkus.datasource.db-kind = postgresql
quarkus.datasource.username = postgres
quarkus.datasource.password = password
quarkus.datasource.jdbc.url = jdbc:postgresql://localhost:5432/quarkusdb_movies

# drop and create the database at startup (use `update` to only update the schema)
quarkus.hibernate-orm.database.generation = drop-and-create
quarkus.http.port=9180

mp.messaging.outgoing.movie-out.connector=smallrye-kafka
mp.messaging.outgoing.movie-out.topic=movie-events
mp.messaging.outgoing.movie-out.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer

kafka.bootstrap.servers=localhost:9092
